<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>السبورة الذكية لإدارة الصف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#d7f0fb;--bg2:#dcf7ea;--glass:rgba(255,255,255,.62);--bd:rgba(255,255,255,.9);--tx:#17324a;--mut:#58738a;--ac:#1f8fd1;--ac2:#25b58a;--ok:#2eb872;--wn:#f2b51d;--bad:#e5484d;--sh:0 10px 40px rgba(31,100,150,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#16314a;--bg2:#15403a;--glass:rgba(24,48,66,.7);--bd:rgba(140,200,230,.25);--tx:#eaf6ff;--mut:#9fbdd0;--sh:0 10px 40px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg1:#16314a;--bg2:#15403a;--glass:rgba(24,48,66,.7);--bd:rgba(140,200,230,.25);--tx:#eaf6ff;--mut:#9fbdd0;--sh:0 10px 40px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Cairo',Tahoma,sans-serif;color:var(--tx);font-size:20px;background:linear-gradient(120deg,var(--bg1),var(--bg2),var(--bg1));background-size:300% 300%;animation:drift 40s ease-in-out infinite;display:flex;flex-direction:column;overflow:hidden}
@keyframes drift{50%{background-position:100% 50%}}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:16px;background:var(--ac);color:#fff;padding:.5em 1em;font-weight:800;transition:transform .12s}
button:active{transform:scale(.95)}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:var(--glass);color:var(--tx);border:1px solid var(--bd)}
button.danger{background:var(--bad);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
input,textarea,select{background:var(--glass);border:1px solid var(--bd);border-radius:12px;padding:.4em .7em}
.g{background:var(--glass);border:1px solid var(--bd);box-shadow:var(--sh);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:28px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px 6px}
#title{font-size:1.5em;font-weight:900;margin:0;padding:0 .4em;border-radius:12px;min-width:5em}
#clock{font-weight:600;color:var(--mut);line-height:1.2;text-align:center;font-size:.85em}
#clsBar{display:flex;gap:6px;align-items:center;padding:4px 8px;border-radius:20px}
#clsSel{border:0;background:transparent;font-weight:800;padding:.25em .4em;max-width:190px}
#clsBar button{padding:.35em .65em;border-radius:12px;font-size:.85em}
#phases{display:flex;gap:6px;padding:5px;border-radius:20px;margin-inline-start:auto}
#phases button{background:transparent;color:var(--mut)}
#phases button.on{background:var(--ac);color:#fff}
.hb{display:flex;gap:8px;align-items:center}
details{position:relative}
summary{list-style:none;cursor:pointer;padding:.5em 1em;border-radius:16px;font-weight:800}
summary::-webkit-details-marker{display:none}
.menu{position:absolute;inset-inline-end:0;top:110%;z-index:30;padding:12px;min-width:230px;display:grid;gap:6px}
.menu label{display:flex;gap:8px;align-items:center;cursor:pointer}
main{flex:1;min-height:0;display:grid;grid-template-columns:3fr 1fr;gap:16px;padding:8px 18px}
#hero{position:relative;padding:18px 22px;display:flex;flex-direction:column;min-height:0}
#hero.full{position:fixed;inset:0;z-index:50;border-radius:0}
.ht{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ht h2{margin:0;font-size:1.4em;flex:1}
#panels{flex:1;min-height:0;overflow:auto}
.panel{display:none;height:100%}
.panel.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
#rail{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0}
.tile{display:flex;align-items:center;gap:12px;text-align:start;background:var(--glass);color:var(--tx);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:22px;padding:12px 14px;width:100%}
.tile .i{font-size:1.9em}.tile b{display:block}.tile small{color:var(--mut);font-size:.8em;font-weight:600}
.tile.alert{animation:shake .4s 3;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
footer{padding:6px 18px 10px;text-align:center;color:var(--mut);font-size:.8em;font-weight:600}
/* tools */
.lights{display:flex;gap:26px;align-items:center}
.pole{display:flex;flex-direction:column;gap:14px;padding:18px;background:#243b4f;border-radius:44px}
.lamp{width:clamp(70px,13vh,120px);aspect-ratio:1;border-radius:50%;padding:0;opacity:.2;filter:saturate(.5)}
.lamp.on{opacity:1;filter:none;box-shadow:0 0 50px currentColor}
#tmsg{font-size:2.6em;font-weight:900;max-width:12em;line-height:1.3}
.ring{position:relative;width:min(46vh,380px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(2.6em,9vh,5em);font-weight:900;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.row input[type=number]{width:4.5em}
.bar{height:26px;border-radius:14px;background:rgba(120,150,170,.25);overflow:hidden;width:min(560px,90%)}
.bar>i{display:block;height:100%;width:0;background:var(--ok);transition:width .15s,background .2s}
.big{font-size:2.4em;font-weight:900}
#wheelc{width:min(52vh,460px);aspect-ratio:1;max-width:100%}
.wrap{position:relative}
.ptr{position:absolute;top:-6px;left:50%;translate:-50% 0;font-size:2.2em;color:var(--bad)}
.ov{position:absolute;inset:0;display:none;place-items:center;background:rgba(10,30,50,.45);z-index:5;border-radius:28px;padding:16px}
.ov.fixed{position:fixed;z-index:80;border-radius:0}
.ov.on{display:grid}.ov .g{padding:26px 34px;display:grid;gap:14px;text-align:center;max-width:min(460px,92vw)}
.ov .nm{font-size:3.4em;font-weight:900;color:var(--ac)}
.tl{width:min(680px,100%);display:grid;gap:8px;text-align:start}
.task{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--bd);cursor:pointer;font-weight:600}
.task .c{width:30px;height:30px;border-radius:50%;border:3px solid var(--ac2);display:grid;place-items:center;flex:none;color:#fff}
.task.d .c{background:var(--ok);border-color:var(--ok)}.task.d span{text-decoration:line-through;opacity:.55}
.task .x{margin-inline-start:auto;background:none;color:var(--mut);padding:0 .4em}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(760px,100%)}
.mode{background:var(--glass);color:var(--tx);border:5px solid transparent;border-radius:26px;padding:16px;display:grid;gap:4px;font-size:1.1em}
.mode span{font-size:3em}.mode.on{border-color:var(--ac2);background:#fff;color:#17324a;box-shadow:0 0 0 6px rgba(37,181,138,.25)}
.board{width:min(760px,100%);min-height:55%;background:#24584f;color:#f4fff9;border:12px solid #b98a58;border-radius:20px;padding:20px 26px;font-size:2.1em;font-weight:600;line-height:1.7;text-align:start;overflow:auto;white-space:pre-wrap}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;width:100%}
.grp{padding:14px;border-radius:24px;background:var(--glass);border:1px solid var(--bd);display:grid;gap:6px;position:relative}
.grp .nm{font-weight:800;outline:0}.grp .pt{font-size:3.6em;font-weight:900;color:var(--wn)}
.fly{position:fixed;font-size:2em;pointer-events:none;z-index:99;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),-200px) rotate(180deg);opacity:0}}
.opts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%}
.opt{padding:14px;border-radius:22px;background:var(--glass);border:1px solid var(--bd);min-width:160px;max-width:240px;flex:1 1 160px;display:grid;gap:8px;position:relative}
.opt .bar{width:100%;height:18px}.opt .bar>i{background:var(--ac)}
.opt-lbl{font-size:1.5em;font-weight:800;padding:4px 8px;border-radius:10px;outline:0;word-break:break-word}
.opt-lbl:hover,.opt-lbl:focus{background:rgba(120,150,170,.12)}
.opt-rm{position:absolute;top:6px;inset-inline-end:8px;background:none;color:var(--mut);padding:2px 6px;font-size:.8em}
#qq{font-size:2em;font-weight:800;max-width:20em;outline:0;padding:4px 10px;border-radius:12px}
.sm{font-size:.7em;color:var(--mut);font-weight:600}
@media(max-width:900px){main{grid-template-columns:1fr;overflow:auto}#rail{flex-direction:row}.tile{min-width:200px}body{overflow:auto}#phases{margin:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
  <h1 id="title" contenteditable="true" spellcheck="false">درس اليوم: انقر لتعديل العنوان</h1>
  <div id="clock"></div>
  <div id="clsBar" class="g">
    <select id="clsSel" aria-label="اختر الفصل"></select>
    <button class="ghost" id="clsAdd" title="إضافة فصل جديد">＋ فصل</button>
    <button class="ghost" id="clsRen" title="تعديل اسم الفصل">✏️</button>
    <button class="ghost" id="clsDel" title="حذف الفصل">🗑️</button>
  </div>
  <div id="phases" class="g"></div>
  <div class="hb">
    <details><summary class="g">🧰 الأدوات</summary><div class="menu g" id="menu"></div></details>
    <button class="ghost g" id="bMute" title="كتم الصوت">🔊</button>
    <button class="ghost g" id="bTheme" title="الوضع الليلي">🌙</button>
    <button class="ghost g" id="bFs" title="ملء الشاشة">⛶</button>
  </div>
</header>
<main>
  <section id="hero" class="g">
    <div class="ht"><h2 id="hT"></h2><button class="ghost" id="bFocus">⤢ تكبير</button></div>
    <div id="panels"></div>
  </section>
  <aside id="rail"></aside>
</main>
<footer>تم تصميم هذه الأداة من قبل <b>عدي عبد الرحمن</b> — ماجستير في المناهج وطرائق التدريس</footer>

<!-- نافذة التأكيد المدمجة -->
<div class="ov fixed" id="confirmOv" role="dialog" aria-modal="true">
  <div class="g">
    <b id="confirmMsg">هل أنت متأكد؟</b>
    <div class="row">
      <button class="danger" id="confirmOk">نعم، تنفيذ</button>
      <button class="ghost" id="confirmCancel">إلغاء</button>
    </div>
  </div>
</div>

<!-- نافذة إدخال اسم الفصل -->
<div class="ov fixed" id="clsOv" role="dialog" aria-modal="true">
  <div class="g">
    <b id="clsOvTitle">إضافة فصل جديد</b>
    <input id="clsOvIn" placeholder="مثال: السابع أ" maxlength="40">
    <div class="row">
      <button id="clsOvOk">حفظ</button>
      <button class="ghost" id="clsOvCancel">إلغاء</button>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=[
 {id:'traffic',n:'إشارة المرور',i:'🚦'},{id:'noise',n:'مقياس الصوت',i:'🎙️'},{id:'timer',n:'المؤقت',i:'⏱️'},
 {id:'wheel',n:'عجلة الأسماء',i:'🎡'},{id:'tasks',n:'مهام الحصة',i:'✅'},{id:'mode',n:'نظام العمل',i:'🧩'},
 {id:'notes',n:'الترحيب والأهداف',i:'📝'},{id:'stars',n:'لوحة النجوم',i:'⭐'},{id:'quiz',n:'سؤال التحدي',i:'💡'}];
const P={
 all:{n:'الكل',t:T.map(x=>x.id),h:'notes'},
 open:{n:'افتتاح',t:['notes','tasks','quiz','wheel','timer'],h:'notes'},
 teach:{n:'شرح',t:['notes','mode','traffic','timer','tasks'],h:'mode'},
 act:{n:'نشاط',t:['timer','traffic','noise','mode','stars','wheel'],h:'timer'},
 end:{n:'ختام',t:['stars','tasks','quiz','notes','wheel'],h:'stars'}};
const TR={r:['توقف: هدوء تام وعمل فردي','#e5484d'],y:['استعد: همس وعمل ثنائي','#f2b51d'],g:['انطلق: نقاش جماعي مسموح','#2eb872']};
const MODES=[['🤫','عمل فردي صامت'],['👥','عمل ثنائي بصوت منخفض'],['🧑‍🤝‍🧑','عمل مجموعات'],['👀','انتباه للمعلم']];

const makeClass=(name='الفصل الافتراضي')=>({
  name,
  title:'',
  traffic:'g',
  tSec:300,
  names:'',
  used:[],
  tasks:[{t:'مراجعة سريعة',d:0},{t:'شرح الفكرة الجديدة',d:0},{t:'نشاط تطبيقي',d:0}],
  notes:'صباح الخير يا أبطال 🌟\nهدفنا اليوم: أن نتعلم شيئاً جديداً معاً',
  groups:[{n:'الصقور',p:0},{n:'النجوم',p:0},{n:'الأبطال',p:0},{n:'المبدعون',p:0}],
  mode:-1,
  q:'ما رأيك؟ اكتب سؤال التحدي هنا',
  opts:[{l:'أ',c:0},{l:'ب',c:0},{l:'ج',c:0}]
});

let S={
  phase:'open',hero:'notes',hidden:[],dark:false,mute:false,sens:60,excl:true,
  activeClass:'c1',
  classes:{c1:makeClass('الفصل الافتراضي')}
};

try{
  const raw=localStorage.getItem('smartboard');
  if(raw){
    const parsed=JSON.parse(raw);
    if(parsed.classes&&Object.keys(parsed.classes).length){
      Object.assign(S,parsed);
    }else{
      // ترحيل البيانات من الإصدار السابق إلى الفصل الأول
      const c=makeClass('الفصل الافتراضي');
      ['title','traffic','tSec','names','used','tasks','notes','groups','mode','q','opts'].forEach(k=>{if(parsed[k]!==undefined)c[k]=parsed[k]});
      ['phase','hero','hidden','dark','mute','sens','excl'].forEach(k=>{if(parsed[k]!==undefined)S[k]=parsed[k]});
      S.classes={c1:c};
      S.activeClass='c1';
    }
  }
}catch(e){}

if(!S.classes||!Object.keys(S.classes).length){S.classes={c1:makeClass('الفصل الافتراضي')};S.activeClass='c1'}
if(!S.classes[S.activeClass])S.activeClass=Object.keys(S.classes)[0];

const cls=()=>S.classes[S.activeClass];
const save=()=>{try{localStorage.setItem('smartboard',JSON.stringify(S))}catch(e){}};

/* sound & effects */
let AC;
function beep(f=660,d=.15,ty='sine',v=.15){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const chime=()=>[784,988,1175].forEach((f,i)=>setTimeout(()=>beep(f,.5),i*160));
function fly(el,em='⭐',n=8){const r=el.getBoundingClientRect();for(let i=0;i<n;i++){const s=document.createElement('div');s.className='fly';s.textContent=em;s.style.left=r.left+r.width/2+'px';s.style.top=r.top+'px';s.style.setProperty('--dx',(Math.random()*240-120)+'px');s.style.animationDelay=i*40+'ms';document.body.appendChild(s);setTimeout(()=>s.remove(),1500)}}
const party=()=>{fly($('#hero'),'🎉',14);fly($('#hero'),'✨',10);chime()};

/* confirm modal */
let confirmCb=null;
function askConfirm(msg,cb){
  $('#confirmMsg').textContent=msg;
  confirmCb=cb;
  $('#confirmOv').classList.add('on');
}
$('#confirmOk').onclick=()=>{const fn=confirmCb;confirmCb=null;$('#confirmOv').classList.remove('on');if(fn)fn()};
$('#confirmCancel').onclick=()=>{confirmCb=null;$('#confirmOv').classList.remove('on')};

/* class management modal */
let clsMode='add';
function openClsModal(mode){
  clsMode=mode;
  $('#clsOvTitle').textContent=mode==='add'?'إضافة فصل جديد':'تعديل اسم الفصل';
  $('#clsOvIn').value=mode==='add'?'':cls().name;
  $('#clsOv').classList.add('on');
  setTimeout(()=>$('#clsOvIn').focus(),20);
}
$('#clsOvCancel').onclick=()=>$('#clsOv').classList.remove('on');
function submitClsModal(){
  const val=$('#clsOvIn').value.trim();
  if(!val)return;
  if(clsMode==='add'){
    const id='c'+Date.now();
    S.classes[id]=makeClass(val);
    S.activeClass=id;
    applyClassState();
  }else{
    cls().name=val;
    renderClasses();
  }
  $('#clsOv').classList.remove('on');
  save();
}
$('#clsOvOk').onclick=submitClsModal;
$('#clsOvIn').onkeydown=e=>{if(e.key==='Enter')submitClsModal()};

function renderClasses(){
  const entries=Object.entries(S.classes);
  $('#clsSel').innerHTML=entries.map(([id,c])=>`<option value="${id}">${esc(c.name)}</option>`).join('');
  $('#clsSel').value=S.activeClass;
  $('#clsDel').disabled=entries.length<=1;
}

/* panels */
const PH={};
PH.traffic=`<div class="lights"><div class="pole">${['r','y','g'].map(k=>`<button class="lamp" data-k="${k}" style="background:${TR[k][1]};color:${TR[k][1]}" aria-label="${TR[k][0]}"></button>`).join('')}</div><div id="tmsg"></div></div>`;
PH.noise=`<div class="big" id="nlv">اضغط للتشغيل</div><div class="bar"><i id="nbar"></i></div><div class="row"><button id="nbtn">🎙️ تشغيل</button><label>الحساسية <input type="range" id="nsens" min="10" max="95"></label></div><div class="sm" id="nerr"></div>`;
PH.timer=`<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(120,150,170,.25)" stroke-width="8"/><circle id="rc" cx="50" cy="50" r="44" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="t" id="tt">05:00</div></div>
<div class="row">${[1,3,5,10].map(m=>`<button class="ghost" data-m="${m}">${m} د</button>`).join('')}<input type="number" id="tm" min="0" max="180" value="5"><b>:</b><input type="number" id="ts" min="0" max="59" value="0"></div>
<div class="row"><button id="tgo">▶ بدء</button><button class="ghost" id="tpa">⏸ إيقاف مؤقت</button><button class="ghost" id="tplus">＋1 د</button><button class="ghost" id="trs">↺ إعادة ضبط</button></div>`;
PH.wheel=`<div class="wrap"><div class="ptr">▼</div><canvas id="wheelc" width="600" height="600"></canvas></div>
<div class="row"><button id="wspin">🎡 أدر العجلة</button><button class="ghost" id="wedit">✏️ الأسماء</button><label><input type="checkbox" id="wex"> استبعاد المختار</label><button class="ghost" id="wrs">إعادة الجميع</button></div>
<div class="ov" id="wed"><div class="g"><b>الصق أسماء الطلاب (اسم في كل سطر)</b><textarea id="wta" rows="9" cols="28"></textarea><button id="wok">حفظ</button></div></div>
<div class="ov" id="wres"><div class="g"><div class="sm">الطالب المختار</div><div class="nm" id="wnm"></div><div class="row"><select id="wgs"></select><button id="wst">⭐ أضف نجمة</button></div><button class="ghost" id="wcl">إغلاق</button></div></div>`;
PH.tasks=`<div class="bar"><i id="pbar"></i></div><div class="sm" id="ptx"></div><div class="tl" id="tl"></div><div class="row"><input id="tin" placeholder="مهمة جديدة…" size="26"><button id="tad">＋ إضافة</button></div>`;
PH.mode=`<div class="modes">${MODES.map((m,i)=>`<button class="mode" data-i="${i}"><span>${m[0]}</span>${m[1]}</button>`).join('')}</div><div class="big" id="mmsg"></div>`;
PH.notes=`<div class="board" id="nt" contenteditable="true" spellcheck="false"></div><div class="sm">انقر على السبورة للكتابة مباشرة</div>`;
PH.stars=`<div class="groups" id="gs"></div><div class="row"><button class="ghost" id="gad">＋ مجموعة</button><button class="ghost" id="grm">－ مجموعة</button><button class="ghost" id="grs">↺ تصفير النقاط</button></div>`;
PH.quiz=`<div id="qq" contenteditable="true" spellcheck="false"></div><div class="sm">انقر على السؤال أو أي خيار لتعديل نصه مباشرة</div><div class="opts" id="qo"></div><div class="row"><button class="ghost" id="qadd">＋ خيار</button><button class="ghost" id="qyn">نعم / لا</button><button class="ghost" id="qabc">أ / ب / ج</button><button class="ghost" id="qabcd">أ / ب / ج / د</button><button class="ghost" id="qrs">↺ تصفير الأصوات</button></div>`;

const vis=()=>P[S.phase].t.filter(x=>!S.hidden.includes(x));
function build(){
 $('#panels').innerHTML=T.map(t=>`<div class="panel" data-t="${t.id}">${PH[t.id]}</div>`).join('');
 $('#phases').innerHTML=Object.entries(P).map(([k,v])=>`<button data-p="${k}">${v.n}</button>`).join('');
 $('#menu').innerHTML=T.map(t=>`<label><input type="checkbox" data-h="${t.id}"> ${t.i} ${t.n}</label>`).join('');
}
function show(){
 const v=vis();if(!v.includes(S.hero))S.hero=v.includes(P[S.phase].h)?P[S.phase].h:v[0];
 $$('#phases button').forEach(b=>b.classList.toggle('on',b.dataset.p===S.phase));
 $$('#menu input').forEach(i=>i.checked=!S.hidden.includes(i.dataset.h));
 $$('.panel').forEach(p=>p.classList.toggle('on',p.dataset.t===S.hero));
 const h=T.find(t=>t.id===S.hero);$('#hT').textContent=h?h.i+' '+h.n:'';
 renderRail();save();
}
const sum={
 traffic:()=>TR[cls().traffic][0].split(':')[0],noise:()=>noiseOn?Math.round(lvl)+'%':'متوقف',timer:()=>fmt(left()),
 wheel:()=>pool().length+' اسم',tasks:()=>{const d=cls().tasks.filter(t=>t.d).length;return d+'/'+cls().tasks.length},
 mode:()=>cls().mode<0?'لم يحدد':MODES[cls().mode][1],notes:()=>'رسالة اليوم',stars:()=>cls().groups.reduce((a,g)=>a+g.p,0)+' نقطة',
 quiz:()=>cls().opts.reduce((a,o)=>a+o.c,0)+' صوت'};
function renderRail(){
 $('#rail').innerHTML=vis().filter(id=>id!==S.hero).map(id=>{const t=T.find(x=>x.id===id);return `<button class="tile" data-t="${id}"><span class="i">${t.i}</span><span><b>${t.n}</b><small data-s="${id}">${sum[id]()}</small></span></button>`}).join('');
}
function setHero(id){S.hero=id;show();beep(520,.08)}

/* traffic */
function setTraffic(k,quiet){cls().traffic=k;$$('.lamp').forEach(l=>l.classList.toggle('on',l.dataset.k===k));$('#tmsg').textContent=TR[k][0];$('#tmsg').style.color=TR[k][1];if(!quiet)beep({r:300,y:500,g:700}[k],.12,'triangle');save()}

/* timer */
let run=false,endAt=0,remain=cls().tSec;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const left=()=>run?Math.max(0,Math.ceil((endAt-Date.now())/1000)):remain;
function tdraw(){const l=left(),t=cls().tSec,f=t?l/t:0;$('#tt').textContent=fmt(l);const c=$('#rc');c.style.strokeDashoffset=276.5*(1-Math.min(1,f));c.style.stroke=f>.5?'#2eb872':f>.2?'#f2b51d':'#e5484d'}
function tset(sec){cls().tSec=sec;remain=sec;run=false;$('#tm').value=Math.floor(sec/60);$('#ts').value=sec%60;tdraw();save()}
function tick(){if(run&&left()<=0){run=false;remain=0;chime();setTraffic('r',true);fly($('#hero'),'⏰',6)}tdraw();$$('[data-s]').forEach(e=>e.textContent=sum[e.dataset.s]())}

/* noise */
let noiseOn=false,lvl=0,an,stream,lastAlert=0;
async function noiseToggle(){
 if(noiseOn){noiseOn=false;stream&&stream.getTracks().forEach(t=>t.stop());$('#nbtn').textContent='🎙️ تشغيل';$('#nlv').textContent='متوقف';$('#nbar').style.width=0;return}
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true});AC=AC||new (window.AudioContext||window.webkitAudioContext)();const s=AC.createMediaStreamSource(stream);an=AC.createAnalyser();an.fftSize=512;s.connect(an);noiseOn=true;$('#nbtn').textContent='⏹ إيقاف';$('#nerr').textContent='';nloop()}
 catch(e){$('#nerr').textContent='تعذر تشغيل الميكروفون: اسمح للمتصفح باستخدامه من إعدادات الموقع.'}}
function nloop(){if(!noiseOn)return;const d=new Uint8Array(an.fftSize);an.getByteTimeDomainData(d);let m=0;d.forEach(v=>m+=Math.abs(v-128));lvl=Math.min(100,m/d.length*9);
 const b=$('#nbar');b.style.width=lvl+'%';b.style.background=lvl<S.sens*.5?'#2eb872':lvl<S.sens?'#f2b51d':'#e5484d';
 $('#nlv').textContent=lvl<S.sens*.5?'هادئ 😌':lvl<S.sens?'متوسط 🙂':'مرتفع! 🔊';
 if(lvl>=S.sens&&Date.now()-lastAlert>4000){lastAlert=Date.now();const t=$('#rail [data-t="noise"]')||$('#hero');t.classList.remove('alert');void t.offsetWidth;t.classList.add('alert');beep(240,.3,'square',.08);if(cls().traffic==='g')setTraffic('y',true)}
 requestAnimationFrame(nloop)}

/* wheel */
const COL=['#59b8e6','#4cc9a0','#f2c14e','#f28c6b','#a98bea','#ef7ca5','#7fcf6b','#5f8fe8'];
let ang=0,spinning=false,picked='';
const pool=()=>cls().names.split('\n').map(s=>s.trim()).filter(Boolean).filter(n=>!cls().used.includes(n));
function wdraw(){const c=$('#wheelc'),x=c.getContext('2d'),p=pool(),n=p.length||1,sg=Math.PI*2/n;x.clearRect(0,0,600,600);
 for(let i=0;i<n;i++){x.beginPath();x.moveTo(300,300);x.arc(300,300,290,ang+i*sg,ang+(i+1)*sg);x.fillStyle=COL[i%COL.length];x.fill();x.strokeStyle='#fff';x.lineWidth=4;x.stroke();
  x.save();x.translate(300,300);x.rotate(ang+(i+.5)*sg);x.fillStyle='#10283c';x.font='800 '+(n>14?20:30)+'px Cairo,Tahoma';x.textAlign='right';x.direction='rtl';x.fillText(p[i]||'أضف أسماء',270,10);x.restore()}
 x.beginPath();x.arc(300,300,34,0,7);x.fillStyle='#fff';x.fill()}
function spin(){const p=pool();if(spinning||!p.length){if(!p.length)$('#wed').classList.add('on');return}
 spinning=true;const n=p.length,sg=Math.PI*2/n,idx=Math.floor(Math.random()*n),M=2*Math.PI,
 fin=-Math.PI/2-(idx+.5)*sg,delta=((fin-ang)%M+M)%M+5*M,a0=ang,t0=performance.now(),D=4200;
 (function f(t){const k=Math.min(1,(t-t0)/D);ang=a0+delta*(1-Math.pow(1-k,3));wdraw();if(Math.floor(ang/sg)!==f.l){f.l=Math.floor(ang/sg);beep(900,.03,'square',.04)}
  if(k<1)requestAnimationFrame(f);else{spinning=false;picked=p[idx];$('#wnm').textContent=picked;$('#wgs').innerHTML=cls().groups.map((g,i)=>`<option value="${i}">${esc(g.n)}</option>`).join('');$('#wres').classList.add('on');chime();fly($('#hero'),'🎊',8);if(S.excl){cls().used.push(picked);save();setTimeout(wdraw,0)}}})(t0)}

/* tasks */
let done=false;
function tasksR(){const ts=cls().tasks,d=ts.filter(t=>t.d).length,n=ts.length;$('#pbar').style.width=(n?d/n*100:0)+'%';$('#ptx').textContent=`أُنجز ${d} من ${n}`;
 $('#tl').innerHTML=ts.map((t,i)=>`<div class="task ${t.d?'d':''}" data-i="${i}"><div class="c">${t.d?'✓':''}</div><span>${esc(t.t)}</span><button class="x" data-x="${i}" aria-label="حذف">✕</button></div>`).join('');
 if(n&&d===n&&!done){done=true;party()}if(d<n)done=false}

/* stars */
function starsR(){$('#gs').innerHTML=cls().groups.map((g,i)=>`<div class="grp" data-i="${i}"><div class="nm" contenteditable="true" spellcheck="false">${esc(g.n)}</div><div class="pt">${g.p}</div><div class="row"><button data-d="1">＋1 ⭐</button><button class="ghost" data-d="-1">－1</button></div></div>`).join('')}

/* quiz */
function quizR(){
 const c=cls();
 $('#qq').textContent=c.q;
 const tot=c.opts.reduce((a,o)=>a+o.c,0)||1;
 $('#qo').innerHTML=c.opts.map((o,i)=>`<div class="opt" data-i="${i}">${c.opts.length>2?`<button class="opt-rm" data-rm="${i}" title="حذف الخيار" aria-label="حذف الخيار">✕</button>`:''}<div class="opt-lbl" contenteditable="true" spellcheck="false">${esc(o.l)}</div><div class="bar"><i style="width:${o.c/tot*100}%"></i></div><b>${o.c}</b><div class="row"><button data-d="1">＋</button><button class="ghost" data-d="-1">－</button></div></div>`).join('');
}

function applyClassState(){
 const c=cls();
 renderClasses();
 $('#title').textContent=c.title||'درس اليوم: انقر لتعديل العنوان';
 $('#wta').value=c.names;
 $('#nt').textContent=c.notes;
 done=c.tasks.length>0&&c.tasks.every(t=>t.d);
 setTraffic(c.traffic,true);
 tset(c.tSec);
 wdraw();
 tasksR();
 starsR();
 quizR();
 modeR();
 show();
}

/* events */
function bind(){
 $('#clsSel').onchange=e=>{S.activeClass=e.target.value;applyClassState();beep(580,.08)};
 $('#clsAdd').onclick=()=>openClsModal('add');
 $('#clsRen').onclick=()=>openClsModal('ren');
 $('#clsDel').onclick=()=>{
   if(Object.keys(S.classes).length<=1)return;
   askConfirm(`هل أنت متأكد من حذف فصل "${cls().name}" بكل بياناته؟`,()=>{
     delete S.classes[S.activeClass];
     S.activeClass=Object.keys(S.classes)[0];
     applyClassState();
     beep(320,.15);
   });
 };

 $('#phases').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;S.phase=b.dataset.p;S.hero=P[S.phase].h;show();beep(600,.1)};
 $('#menu').onchange=e=>{const id=e.target.dataset.h;S.hidden=e.target.checked?S.hidden.filter(x=>x!==id):[...S.hidden,id];show()};
 $('#rail').onclick=e=>{const b=e.target.closest('[data-t]');if(b)setHero(b.dataset.t)};
 $('#bFocus').onclick=()=>{const f=$('#hero').classList.toggle('full');$('#bFocus').textContent=f?'⤡ تصغير':'⤢ تكبير'};
 $('#bMute').onclick=()=>{S.mute=!S.mute;$('#bMute').textContent=S.mute?'🔇':'🔊';save()};
 $('#bTheme').onclick=()=>{S.dark=!S.dark;theme();save()};
 $('#bFs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
 $('#title').oninput=e=>{cls().title=e.target.textContent;save()};
 $$('.lamp').forEach(l=>l.onclick=()=>setTraffic(l.dataset.k));
 $('#nbtn').onclick=noiseToggle;$('#nsens').value=S.sens;$('#nsens').oninput=e=>{S.sens=+e.target.value;save()};
 $$('[data-m]').forEach(b=>b.onclick=()=>tset(b.dataset.m*60));
 const man=()=>tset((+$('#tm').value||0)*60+(+$('#ts').value||0));$('#tm').onchange=man;$('#ts').onchange=man;
 $('#tgo').onclick=()=>{if(run)return;if(remain<=0)remain=cls().tSec;endAt=Date.now()+remain*1000;run=true;beep(700,.1)};
 $('#tpa').onclick=()=>{if(run){remain=left();run=false}};
 $('#tplus').onclick=()=>{
   if(run){endAt+=60000;cls().tSec+=60}
   else{remain+=60;cls().tSec=Math.max(cls().tSec+60,remain);$('#tm').value=Math.floor(remain/60);$('#ts').value=remain%60}
   tdraw();save();beep(760,.08);
 };
 $('#trs').onclick=()=>tset(cls().tSec);
 $('#wex').checked=S.excl;$('#wex').onchange=e=>{S.excl=e.target.checked;save()};
 $('#wedit').onclick=()=>{$('#wta').value=cls().names;$('#wed').classList.add('on')};
 $('#wok').onclick=()=>{cls().names=$('#wta').value;cls().used=[];$('#wed').classList.remove('on');save();wdraw();show()};
 $('#wspin').onclick=spin;
 $('#wrs').onclick=()=>{
   if(!cls().used.length){wdraw();return}
   askConfirm('هل أنت متأكد من إعادة جميع الأسماء المستبعدة إلى العجلة؟',()=>{cls().used=[];save();wdraw();show();beep(620,.1)});
 };
 $('#wcl').onclick=()=>$('#wres').classList.remove('on');
 $('#wst').onclick=()=>{const g=cls().groups[+$('#wgs').value];if(g){g.p++;save();starsR();fly($('#wst'),'⭐');beep(1000,.2)}$('#wres').classList.remove('on')};
 $('#tl').onclick=e=>{const x=e.target.closest('[data-x]');if(x){cls().tasks.splice(+x.dataset.x,1)}else{const r=e.target.closest('.task');if(!r)return;const t=cls().tasks[+r.dataset.i];t.d=t.d?0:1;if(t.d){beep(880,.15);fly(r,'✨',3)}}save();tasksR()};
 const add=()=>{const v=$('#tin').value.trim();if(v){cls().tasks.push({t:v,d:0});$('#tin').value='';save();tasksR()}};$('#tad').onclick=add;$('#tin').onkeydown=e=>{if(e.key==='Enter')add()};
 $$('.mode').forEach(b=>b.onclick=()=>{cls().mode=+b.dataset.i;modeR();save();beep(660,.1)});
 $('#nt').oninput=e=>{cls().notes=e.target.innerText;save()};
 $('#gs').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const g=cls().groups[+b.closest('.grp').dataset.i],d=+b.dataset.d;g.p=Math.max(0,g.p+d);save();starsR();if(d>0){fly(b,'⭐');beep(1040,.25)}else beep(300,.15)};
 $('#gs').oninput=e=>{const c=e.target.closest('.nm');if(c){cls().groups[+c.closest('.grp').dataset.i].n=c.textContent;save()}};
 $('#gad').onclick=()=>{if(cls().groups.length<6){cls().groups.push({n:'مجموعة '+(cls().groups.length+1),p:0});save();starsR()}};
 $('#grm').onclick=()=>{if(cls().groups.length>2){cls().groups.pop();save();starsR()}};
 $('#grs').onclick=()=>{
   askConfirm('هل أنت متأكد من تصفير نقاط جميع المجموعات؟',()=>{cls().groups.forEach(g=>g.p=0);save();starsR();beep(320,.15)});
 };
 $('#qq').oninput=e=>{cls().q=e.target.textContent;save()};
 $('#qo').onclick=e=>{
   const rm=e.target.closest('[data-rm]');
   if(rm){if(cls().opts.length>2){cls().opts.splice(+rm.dataset.rm,1);save();quizR()}return}
   const b=e.target.closest('[data-d]');if(!b)return;
   const o=cls().opts[+b.closest('.opt').dataset.i];o.c=Math.max(0,o.c+ +b.dataset.d);save();quizR();beep(560,.08);
 };
 $('#qo').oninput=e=>{
   const lbl=e.target.closest('.opt-lbl');
   if(lbl){cls().opts[+lbl.closest('.opt').dataset.i].l=lbl.textContent;save()}
 };
 $('#qadd').onclick=()=>{
   if(cls().opts.length<6){cls().opts.push({l:'خيار '+(cls().opts.length+1),c:0});save();quizR()}
 };
 $('#qyn').onclick=()=>{cls().opts=[{l:'نعم',c:0},{l:'لا',c:0}];save();quizR()};
 $('#qabc').onclick=()=>{cls().opts=[{l:'أ',c:0},{l:'ب',c:0},{l:'ج',c:0}];save();quizR()};
 $('#qabcd').onclick=()=>{cls().opts=[{l:'أ',c:0},{l:'ب',c:0},{l:'ج',c:0},{l:'د',c:0}];save();quizR()};
 $('#qrs').onclick=()=>{
   askConfirm('هل أنت متأكد من تصفير جميع أصوات سؤال التحدي؟',()=>{cls().opts.forEach(o=>o.c=0);save();quizR();beep(320,.15)});
 };
}
function modeR(){$$('.mode').forEach(b=>b.classList.toggle('on',+b.dataset.i===cls().mode));$('#mmsg').textContent=cls().mode<0?'اختر نمط العمل':MODES[cls().mode][1]}
function theme(){document.documentElement.dataset.theme=S.dark?'dark':'light';$('#bTheme').textContent=S.dark?'☀️':'🌙'}
function clock(){const d=new Date();$('#clock').innerHTML=d.toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'})+'<br>'+d.toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'})}

build();bind();
if(!S.dark&&!localStorage.getItem('smartboard'))S.dark=matchMedia('(prefers-color-scheme:dark)').matches;
theme();$('#bMute').textContent=S.mute?'🔇':'🔊';
applyClassState();clock();
setInterval(tick,250);setInterval(clock,20000);
</script>
</body>
</html>
